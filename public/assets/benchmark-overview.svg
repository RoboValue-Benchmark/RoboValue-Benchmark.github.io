<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="370" viewBox="0 0 1280 370" role="img" aria-labelledby="title desc">
  <title id="title">RoboValue evaluation workflow</title>
  <desc id="desc">15 simulation and 20 real-world tasks under standard and shifted conditions connect to scalar, pairwise, and textual model interfaces, yielding four capability profiles. Subtask Identification Accuracy is reported separately.</desc>
  <rect width="1280" height="370" rx="18" fill="#faf8fd"/>
  <g fill="#fff" stroke="#e4deed"><rect x="24" y="24" width="380" height="285" rx="14"/><rect x="450" y="24" width="380" height="285" rx="14"/><rect x="876" y="24" width="380" height="285" rx="14"/></g>
  <g font-family="Arial, sans-serif">
    <g fill="#9b8caf" font-size="13" font-weight="700"><text x="50" y="56">01 · DATA</text><text x="476" y="56">02 · INTERFACES</text><text x="902" y="56">03 · EVALUATION</text></g>
    <g fill="#30293d" font-size="22" font-weight="700"><text x="50" y="92">Sim-and-real trajectories</text><text x="476" y="92">Shared model interfaces</text><text x="902" y="92">Four capability profiles</text></g>
    <g fill="#6750bb" font-size="34" font-weight="700"><text x="50" y="149">15</text><text x="50" y="191">20</text></g>
    <g fill="#655a73" font-size="17"><text x="103" y="145">Simulation tasks</text><text x="103" y="187">Real-world tasks</text></g>
    <g fill="#7c7088" font-size="15"><text x="50" y="236">Standard · Cross-embodiment</text><text x="50" y="260">Cross-environment</text></g>
    <g fill="#f4effb"><rect x="476" y="117" width="328" height="34" rx="6"/><rect x="476" y="158" width="328" height="34" rx="6"/><rect x="476" y="199" width="328" height="34" rx="6"/></g>
    <g fill="#675784" font-size="16"><text x="491" y="139">Scalar value</text><text x="491" y="180">Pairwise comparison</text><text x="491" y="221">Subtask description</text></g>
    <g fill="#7c7088" font-size="14"><text x="476" y="268">Preserve native value semantics</text></g>
    <g font-size="16"><text x="918" y="138" fill="#6754bf">Task-State Understanding</text><text x="918" y="174" fill="#267d91">Temporal Progress Monitoring</text><text x="918" y="210" fill="#ba6a40">Failure and Recovery Reasoning</text><text x="918" y="246" fill="#437858">Value Consistency</text></g>
    <g fill="#9986b7" font-size="28"><text x="416" y="173">→</text><text x="843" y="173">→</text></g>
    <text x="640" y="344" text-anchor="middle" fill="#7c7088" font-size="15">Unified diagnostic evaluation · Zero-shot and one-shot rankings · SIA reported separately</text>
  </g>
</svg>
